<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sitio en mantenimiento</title>
  <meta name="description" content="Estamos realizando tareas de mantenimiento. Volvemos en breve." />
  <meta name="robots" content="noindex" />
  <style>
    :root {
      --bg: #0e1116;
      --surface: #171b22;
      --border: #262c36;
      --text: #e6e9ee;
      --muted: #9aa4b2;
      --accent: #4f8cff;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f8fa;
        --surface: #ffffff;
        --border: #e1e4e8;
        --text: #1b1f24;
        --muted: #57606a;
        --accent: #2f6fe0;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      color: var(--accent);
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 12px;
    }
    p {
      color: var(--muted);
      margin: 0 0 8px;
    }
    .contact {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main role="main">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 2a10 10 0 1 0 10 10" />
      <path d="M12 6v6l4 2" />
    </svg>
    <h1>Sitio en mantenimiento</h1>
    <p>Estamos realizando tareas de actualización para mejorar el servicio.</p>
    <p>Volvemos a estar en línea en breve. Gracias por tu paciencia.</p>
    <div class="contact">
      Consultas: <a href="mailto:contacto@luishuergo.edu.ar">contacto@luishuergo.edu.ar</a>
    </div>
  </main>
</body>
</html>
